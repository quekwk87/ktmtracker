name: KTMB Shuttle Checker

on:
  schedule:
    # Runs every 15 minutes during waking hours (SGT = UTC+8)
    # SGT 06:00-23:59 = UTC 22:00-23:59 and 00:00-15:59
    - cron: "*/15 22-23 * * *"
    - cron: "*/15 0-15 * * *"

  workflow_dispatch:
    inputs:
      origin:
        description: "Origin station"
        required: false
        default: "Use saved config"
        type: choice
        options:
          - "Use saved config"
          - "WOODLANDS CIQ"
          - "JB SENTRAL"
      date:
        description: "Travel date, DD/MM/YYYY. Leave blank to use repo variable/file config."
        required: false
        type: string
      pax:
        description: "Passenger count"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
      preferred_times:
        description: "Comma-separated departure times, e.g. 17:30,18:45. Leave blank for any time."
        required: false
        type: string

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  # Scheduled runs read searches.json. Manual Run workflow inputs, if origin + date are set, override it.
  KTMB_ORIGIN: ${{ inputs.origin }}
  KTMB_DATE: ${{ inputs.date }}
  KTMB_PAX: ${{ inputs.pax }}
  KTMB_PREFERRED_TIMES: ${{ inputs.preferred_times }}

permissions:
  contents: write

# Never run two checks at once (both would read/write the same Telegram updates).
concurrency:
  group: ktmb-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run checker
        run: python checker.py

      # Saves searches/pause state changed via Telegram commands.
      - name: Save bot changes
        run: |
          git config user.name "ktmb-checker-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add searches.json bot_state.json
          if git diff --cached --quiet; then
            echo "No changes to save."
            exit 0
          fi
          git commit -m "Update searches from Telegram bot"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
